CONFIG_LOG=y

# Recovery: task watchdog over the hardware WDT, reboot on fatal errors
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
# Hardware WDT reload ~1 s instead of 120 ms: fewer wake-ups to feed it.
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_RESET_ON_FATAL_ERROR=y

# Battery: MAX17048 fuel gauge, BQ25180 charger
CONFIG_FUEL_GAUGE=y
CONFIG_CHARGER=y

# Session clock: TIMER3 + PPI capture of the PDM start
CONFIG_NRFX_PPI=y

# Microphone
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Bluetooth peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Replaced at boot by "DIBS_Audio-XXXX" from the FICR device ID (ble.c)
CONFIG_BT_DEVICE_NAME="DIBS_Audio-0000"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_MAX_CONN=1

# Throughput: 2M PHY, 251-byte data length, 247-byte ATT MTU (negotiated
# automatically; USER_PHY_UPDATE only enables the le_phy_updated log callback)
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# High-rate IMU + audio is ~33 kB/s: let the controller queue more packets
# per connection event (default 3).
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=8
